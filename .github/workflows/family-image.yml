name: Family edition image

# Tests the family edition and publishes it as
# ghcr.io/<your-github-name>/kinkudos-family:latest for the Hostinger server.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-image
  cancel-in-progress: true

jobs:
  test:
    name: Test family edition
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements.lock
          python -m pip install --disable-pip-version-check ruff==0.16.2

      - name: Run Ruff
        run: python -m ruff check .

      - name: Translations are up to date
        run: |
          python scripts/compile_translations.py
          git diff --exit-code -- locale

      - name: Check for missing migrations
        env:
          KINKUDOS_DEBUG: "false"
          KINKUDOS_SECRET_KEY: ci-test-only-9Fq7wR2mX8vK4pL6sN1cD5hJ3tB0zA7yE9uQ
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static assets for tests
        env:
          KINKUDOS_DEBUG: "false"
          KINKUDOS_SECRET_KEY: ci-deploy-check-only-9Fq7wR2mX8vK4pL6sN1cD5hJ3tB0zA7yE9uQ
          KINKUDOS_ALLOWED_HOSTS: test.example.com
          KINKUDOS_CSRF_TRUSTED_ORIGINS: https://test.example.com
        run: python manage.py collectstatic --noinput

      - name: Run Django tests
        env:
          KINKUDOS_DEBUG: "false"
          KINKUDOS_SECRET_KEY: ci-test-only-9Fq7wR2mX8vK4pL6sN1cD5hJ3tB0zA7yE9uQ
          KINKUDOS_SECURE_SSL_REDIRECT: "false"
          KINKUDOS_DEVICE_PAIRING_REQUIRED: "false"
        run: python manage.py test --noinput

  image:
    name: Publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kinkudos-family" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
